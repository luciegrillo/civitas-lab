name: Bug report
description: Report a reproducible software or artifact defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove private data from configurations and artifacts.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, configuration, seed, and relevant output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Civitas Lab version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "25.0.1"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, checksum failures, or platform details.
